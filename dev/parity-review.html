<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>仮免・本免 表示点検</title>
<style>*{box-sizing:border-box}body{font:14px system-ui;margin:0;background:#dae3eb;color:#193247}header{padding:14px;background:white;display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,select{min-height:44px;font:inherit}main{display:flex;gap:16px;overflow:auto;padding:16px}iframe{border:0;flex-shrink:0;background:white}pre{white-space:pre-wrap;background:white;padding:16px}h1{font-size:18px}</style>
<header><h1>仮免・本免 表示点検</h1><span>架空記録のみ。端末の学習記録は変更しません。</span><label>幅 <select id="width"><option>360</option><option selected>390</option><option>430</option><option>1200</option></select></label><label>表示 <select id="screen"></select></label><label>配色 <select id="theme"><option>light</option><option>dark</option></select></label><button id="render">表示する</button><button id="audit">全状態を点検</button><button id="images">画像・危険予測を点検</button></header><main><iframe title="仮免" id="karimen" sandbox="allow-scripts allow-same-origin"></iframe><iframe title="本免" id="honmen" sandbox="allow-scripts allow-same-origin"></iframe></main><pre id="status" aria-live="polite"></pre><pre id="results"></pre>
<script>
const screens=['mock','learn','review','review-due','review-wait','notes','note-open','question','answer-correct','answer-wrong','result-empty','result-low','result-pass','result-excellent','result-perfect','settings','question-image','answer-image','hazard','hazard-answer','figure'];
const $=id=>document.getElementById(id);$('screen').innerHTML=screens.map(s=>`<option>${s}</option>`).join('');let version=0,results=[],pending=new Map(),busy=false;
function fixture(c){
 const memory=new Map();Object.defineProperty(window,'indexedDB',{value:undefined});Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)??null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k)}});
 const post=data=>parent.postMessage({version:c.version,course:c.course,screen:c.screen,width:c.width,theme:c.theme,...data},'*');
 addEventListener('error',e=>post({error:e.message}));
 document.addEventListener('DOMContentLoaded',async()=>{try{
 const h=c.course==='honmen',click=s=>{const el=document.querySelector(s);if(!el)throw Error('Missing '+s);el.click();};
 if(h){if(!await HonmenReady)throw Error('Startup');const m=HonmenApp.model,bank=[...m.byId.values()],q=bank.find(q=>c.screen.startsWith('hazard')?q.type==='hazard':c.screen.includes('image')||c.screen==='figure'?q.type==='boolean'&&q.image:q.type==='boolean');m.settings({theme:c.theme,sound:false,reduceMotion:true});document.documentElement.dataset.theme=c.theme;
 const resume=()=>{click('#tab-learn');click('#learn [data-h="resume"]');};
 if(['question','answer-correct','answer-wrong','question-image','answer-image','hazard','hazard-answer','figure'].includes(c.screen)){m.begin({ids:[q.id],mode:'study'});resume();if(c.screen.startsWith('answer-')||c.screen==='hazard-answer'){const keys=q.type==='hazard'?q.answer:[q.answer];keys.forEach((v,i)=>click(`[data-h="answer"][data-part="${i}"][data-value="${c.screen==='answer-wrong'?!v:v}"]`));if(q.type==='hazard')click('[data-h="commit"]');}if(c.screen==='figure')click('[data-h="figure"]');}
 else if(c.screen.startsWith('result-')){const ids=bank.filter(q=>q.set===qSet()).map(q=>q.id);function qSet(){return bank[0].set;}m.begin({ids,mode:'mock',set:qSet()});const a=m.state.sessions.mock;if(c.screen!=='result-empty'){const wrong={'result-low':11,'result-pass':10,'result-excellent':4,'result-perfect':0}[c.screen];a.keys.forEach((key,i)=>key.forEach((v,j)=>m.answer('mock',i,i<wrong?!v:v,j)));}const r=m.finish('mock');click('[data-h="settings"]');click('[data-h="records"]');click(`[data-h="history"][data-record="${r.id}"]`);}
 else if(c.screen==='settings')click('[data-h="settings"]');
 else if(c.screen.startsWith('review-')){m.begin({ids:[q.id]});m.answer('study',0,!q.answer);m.finish('study');if(c.screen==='review-wait'){m.begin({ids:[q.id],mode:'review'});m.answer('review',0,q.answer);m.finish('review');}click('#tab-review');}
 else if(['notes','note-open'].includes(c.screen)){click('#tab-learn');click('[data-h="learn-section"][data-value="notes"]');if(c.screen==='note-open'){const n=document.querySelector('[data-h-note]');n.open=true;n.dispatchEvent(new Event('toggle'));}}
 else click('#tab-'+c.screen);
 }else{
 if(window.KarimenStartup&&!await KarimenStartup)throw Error('Startup');state.theme=c.theme;state.sound=false;state.reduceMotion=true;theme();const q=['question-image','answer-image','hazard','hazard-answer','figure'].includes(c.screen)?activeQuestion(403):Q[0];
 if(['question','answer-correct','answer-wrong','question-image','answer-image','hazard','hazard-answer','figure'].includes(c.screen)){startStudy([q.id],'表示点検');if(c.screen.startsWith('answer-')||c.screen==='hazard-answer'){model.answer(c.screen==='answer-wrong'?!q.a:q.a);renderPlay();}if(c.screen==='figure')click('[data-action="question-zoom"]');}
 else if(c.screen.startsWith('result-')){const worksheet=model.worksheet(1);model.begin({ids:worksheet.orderedIds,kind:'mock',worksheet:1,label:'表示点検'});if(c.screen!=='result-empty'){const wrong={'result-low':6,'result-pass':5,'result-excellent':2,'result-perfect':0}[c.screen];state.session.answers=state.session.ids.map((id,i)=>i<wrong?!activeQuestion(id).a:activeQuestion(id).a);}lastResult=model.finish();renderResult();show('result');}
 else if(c.screen==='settings')settings();
 else if(c.screen.startsWith('review-')){model.record(q.id,!q.a);if(c.screen==='review-wait'){state.stats[q.id].reviewAt=Date.now()+1800000;state.stats[q.id].reviewPass=1;}navigate('review');}
 else if(['notes','note-open'].includes(c.screen)){navigate('learn');learnSection='notes';renderLearn();if(c.screen==='note-open'){const n=document.querySelector('#learn-notes details.note');n.open=true;populateNote(n);}}
 else navigate(c.screen);
 }
 // Force fixture images to load before measuring, including below-the-fold lazy thumbnails.
 [...document.images].forEach(i=>i.loading='eager');
 await document.fonts.ready;
 await Promise.race([Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))),new Promise(r=>setTimeout(r,5000))]);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
 const activeDialog=document.querySelector('dialog[open]'),root=activeDialog||document;
 const visible=e=>!!(e.getBoundingClientRect().width&&e.getBoundingClientRect().height)&&getComputedStyle(e).visibility!=='hidden'&&!e.closest('[hidden]');
 const style={};for(const sel of ['.page-heading h2','.recommend','.category-card','.question','.learning-points','.point-main','.point-detail','.answer-result-title','.score','.result-achievement','.achievement-copy h3','.review-now-card','.note','.settings-group h3']){const e=[...root.querySelectorAll(sel)].find(visible);if(e){const s=getComputedStyle(e);style[sel]=Object.fromEntries(['fontFamily','fontSize','fontWeight','letterSpacing','lineHeight','borderRadius','paddingTop','paddingRight','paddingBottom','paddingLeft','color','backgroundColor'].map(k=>[k,s[k]]));}}
 const overflow=[...root.querySelectorAll('h1,h2,h3,p,button,section,article,figure')].filter(visible).filter(e=>e.getBoundingClientRect().right>innerWidth+1||e.getBoundingClientRect().left< -1).map(e=>({tag:e.tagName,cls:e.className,text:e.textContent.trim().slice(0,40)}));
 const small=[...root.querySelectorAll('button,input,select,summary,a')].filter(visible).map(e=>e.matches('input[type=checkbox]')&&e.closest('label')?e.closest('label'):e).filter(e=>{const r=e.getBoundingClientRect();return r.width<44||r.height<44}).map(e=>({tag:e.tagName,text:e.textContent.trim().slice(0,40),width:e.getBoundingClientRect().width,height:e.getBoundingClientRect().height}));
 post({ok:true,documentWidth:document.documentElement.scrollWidth,overflow,small,images:[...root.querySelectorAll('img')].filter(visible).filter(e=>!e.complete||!e.naturalWidth).map(e=>e.getAttribute('src')),style});
 }));
 }catch(e){post({error:e.stack||e.message});}});
}
async function load(width,screen,theme){const v=++version;const rows=await Promise.all(['karimen','honmen'].map(async course=>{const frame=$(course);frame.width=width;frame.height=820;const c={version:v,course,width,screen,theme};const response=await fetch('../'+(course==='honmen'?'honmen.html':'index.html')+'?audit='+v);if(!response.ok)throw Error(response.status);let html=await response.text();const boot='('+fixture.toString()+')('+JSON.stringify(c)+')';html=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'"><script>'+boot.replaceAll('</script','<\\/script')+'<\/script>');const promise=new Promise(resolve=>{const key=v+course,timer=setTimeout(()=>{pending.delete(key);resolve({...c,error:'timeout'});},20000);pending.set(key,d=>{clearTimeout(timer);resolve(d);});});frame.srcdoc=html;return promise;}));return rows;}
addEventListener('message',e=>{if(![$('karimen').contentWindow,$('honmen').contentWindow].includes(e.source))return;const d=e.data;if(!d||(!d.ok&&!d.error))return;pending.get(d.version+d.course)?.(d);pending.delete(d.version+d.course);});
function summarize(){const differences=[];for(let i=0;i<results.length;i+=2){const [a,b]=results.slice(i,i+2);if(!a?.style||!b?.style)continue;for(const sel of Object.keys(a.style)){if(b.style[sel]&&JSON.stringify(a.style[sel])!==JSON.stringify(b.style[sel]))differences.push({screen:a.screen,width:a.width,theme:a.theme,selector:sel,karimen:a.style[sel],honmen:b.style[sel]});}}return {states:results.length,errors:results.filter(r=>r.error),overflow:results.filter(r=>r.overflow?.length||r.documentWidth>r.width),unloadedImages:results.filter(r=>r.images?.length),smallTargets:results.filter(r=>r.small?.length).map(({style,...r})=>r),styleDifferences:differences};}
$('render').onclick=async()=>{if(busy)return;busy=true;try{results=await load(Number($('width').value),$('screen').value,$('theme').value);$('status').textContent='表示完了';$('results').textContent=JSON.stringify(summarize(),null,2);}finally{busy=false;}};
async function audit(selectedScreens){if(busy)return;busy=true;results=[];try{for(const width of [360,390,430,1200])for(const theme of ['light','dark'])for(const screen of selectedScreens){$('status').textContent=`点検中 ${width}px ${theme} ${screen} (${results.length}/${selectedScreens.length*16})`;results.push(...await load(width,screen,theme));$('results').textContent=JSON.stringify(summarize(),null,2);}$('status').textContent=`全${selectedScreens.length*16}状態 点検完了`;}finally{busy=false;}};
$('audit').onclick=()=>audit(screens);$('images').onclick=()=>audit(screens.slice(-5));
$('render').click();
</script></html>
