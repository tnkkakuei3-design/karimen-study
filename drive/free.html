<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f1"><title>フリードライブ | 運転体験</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./free.css?v=1"></head><body>
<header><a id="back" href="./">‹ コース一覧</a><h1>フリードライブ</h1><button id="pause" aria-label="一時停止" disabled>一時停止</button></header>
<main><section id="viewport" aria-label="自由に走れる街"><canvas id="world" aria-label="街の3D走行画面"></canvas><div class="topline"><span id="area">教習所前</span><button id="camera" aria-label="視点を切り替える">車の後ろ</button></div><div class="map-wrap"><canvas id="map" width="220" height="220" aria-label="街の地図。黄色い矢印が現在地"></canvas><span>北 ↑</span></div><div id="notice" role="status" aria-live="polite"></div><div class="travel"><span id="trip">0.00 km</span><span id="visits">立ち寄り 0 / 4</span></div></section>
<section class="cockpit" aria-label="運転操作"><div class="instruments"><div><strong id="speed">0</strong><small>km/h</small></div><span id="direction">前進</span><button id="gear" disabled aria-label="停止して前進とバックを切り替える">D ⇄ R</button></div><div class="inputs"><div class="wheel-wrap"><button id="wheel" aria-label="ハンドル。左右にドラッグ" disabled><svg viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="55"/><path d="M18 53 57 69M122 53 83 69M70 82v43"/><circle class="hub" cx="70" cy="70" r="18"/><path class="marker" d="M70 15v10"/></svg></button><div class="nudges"><button id="left" aria-label="左にハンドルを切る" disabled>←</button><span>ハンドル</span><button id="right" aria-label="右にハンドルを切る" disabled>→</button></div></div><button id="brake" class="pedal brake" disabled><i></i>ブレーキ</button><button id="gas" class="pedal gas" disabled><i></i>アクセル</button></div></section><p class="key-help">↑ アクセル · ↓ ブレーキ · ← → ハンドル · R 前進／バック · Esc 一時停止</p></main>
<dialog id="menu" aria-labelledby="menu-title"><small class="eyebrow">FREE DRIVE</small><h2 id="menu-title">今日は、どこまで走ろう。</h2><p id="menu-copy">住宅街を抜けて、海沿いへ。<br>交差点は好きな方向へ曲がれます。</p><div class="destinations">教習所 / 商店街 / 中央公園 / 海辺の広場</div><p class="help">ペダルは長押し。ハンドルは左右へドラッグ。<br>停止して D ⇄ R を押すとバックできます。<br>目的地の近くで速度を落とすと、立ち寄りを記録します。</p><button id="start" class="primary" disabled>街を準備しています…</button><div class="settings"><button id="sound" aria-pressed="false">音：オフ</button><button id="quality" aria-pressed="false">画質：標準</button><button id="recover">道路に戻す</button></div><a id="menu-back" href="./">コース一覧に戻る</a><p id="save-status" class="help"></p></dialog>
<script type="module" src="./free-app.mjs?v=assets1"></script></body></html>
