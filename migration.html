<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>学習記録の引き継ぎ — 仮免ドリル</title><link rel="stylesheet" href="./styles.css"><style>body{padding:24px}main{max-width:600px;margin:32px auto}h1{font-size:1.5rem}h2{font-size:1.15rem}p{line-height:1.8}.btn{margin:8px 0}a{display:inline-block;margin:12px 0}section{margin:24px 0;padding:18px;background:var(--soft);border-radius:12px}textarea{width:100%;min-height:110px;margin:8px 0;font-size:16px}input[type=file]{max-width:100%;margin:12px 0}label{display:block}#transfer-preview{white-space:pre-line;font-weight:700}[hidden]{display:none!important}</style></head>
<body><main><h1>学習記録の引き継ぎ</h1>
<p id="transfer-status" role="status" aria-live="polite">保存記録を確認しています…</p>
<button id="transfer-start" class="btn" hidden>自動で引き継ぐ</button>
<section id="transfer-export" hidden><h2>コピー・ファイルで引き継ぐ</h2><p>① 記録をコピー、またはファイルに保存<br>② 新サイトを開く<br>③ 貼り付け、またはファイルを選んで確認</p>
<button id="transfer-copy" class="btn">記録をコピー</button> <button id="transfer-download" class="btn secondary">ファイルに保存</button>
<p id="transfer-export-status" role="status"></p><div id="transfer-copy-fallback" hidden><label for="transfer-export-text">コピーできない場合は、以下を長押ししてすべて選択・コピーしてください。</label><textarea id="transfer-export-text" readonly spellcheck="false"></textarea></div>
<a href="https://karimen-study.pages.dev/migration.html">新サイトで記録を取り込む →</a></section>
<section id="transfer-import" hidden><h2>記録を取り込む</h2><p>旧アプリで「記録をコピー」または「ファイルに保存」を行い、ここで取り込んでください。自動引き継ぎの再操作は不要です。</p>
<label for="transfer-text">コピーした記録を貼り付け</label><textarea id="transfer-text" spellcheck="false" autocomplete="off" placeholder="ここを長押ししてペースト"></textarea>
<label for="transfer-file">または保存した記録ファイルを選択</label><input id="transfer-file" type="file" accept=".json,application/json">
<button id="transfer-check" class="btn secondary">内容を確認</button><p id="transfer-preview" role="status"></p><button id="transfer-save" class="btn" hidden>この記録を保存する</button></section>
<p id="transfer-help">これまで学習した端末・ブラウザで開いてください。旧サイトの記録は削除しません。</p><a id="transfer-home" href="./">学習画面へ戻る</a>
</main><script defer src="./questions.js"></script><script defer src="./cloud-record.js?v=1"></script><script defer src="./model.js"></script><script defer src="./progress-storage.js"></script><script defer src="./migration.js?v=2"></script></body></html>
